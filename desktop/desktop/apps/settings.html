<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Settings</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: transparent;
        color: #111827;
      }
      .settings-root {
        padding: 16px 20px;
        font-size: 13px;
      }
      .settings-title {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .settings-subtitle {
        font-size: 12px;
        color: #6b7280;
        margin-bottom: 12px;
      }
      .settings-section-title {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #6b7280;
        margin-top: 16px;
        margin-bottom: 6px;
      }
      .settings-card {
        border-radius: 8px;
        border: 1px solid #e5e7eb;
        background: #f9fafb;
        padding: 10px 12px;
        margin-bottom: 8px;
      }
      .settings-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
      }
      .settings-label {
        font-size: 12px;
      }
      .settings-slider {
        flex: 1;
      }
      .settings-pill-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .settings-pill {
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid #d1d5db;
        background: #f3f4f6;
        font-size: 12px;
        cursor: pointer;
      }
      .settings-pill.active {
        border-color: #2563eb;
        background: rgba(37,99,235,0.12);
        color: #1d4ed8;
      }
      .settings-app-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .settings-app-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
      }
      .settings-toggle-btn {
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid #d1d5db;
        background: #f9fafb;
        cursor: pointer;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="settings-root">
      <div class="settings-title">Settings</div>
      <div class="settings-subtitle">
        Adjust appearance, theme, and installed apps for the QA Desktop.
      </div>

      <div class="settings-section-title">Display</div>
      <div class="settings-card">
        <div class="settings-row">
          <span class="settings-label">Brightness</span>
          <input
            id="settings-brightness"
            class="settings-slider"
            type="range"
            min="50"
            max="120"
            value="100"
          />
        </div>
      </div>

      <div class="settings-section-title">Theme</div>
      <div class="settings-card">
        <div class="settings-pill-row">
          <button
            id="settings-theme-light"
            class="settings-pill active"
          >
            Light
          </button>
          <button id="settings-theme-dark" class="settings-pill">
            Dark
          </button>
        </div>
      </div>

      <div class="settings-section-title">Background</div>
      <div class="settings-card">
        <div class="settings-pill-row">
          <button
            class="settings-pill active"
            data-bg="default"
          >
            Default
          </button>
          <button class="settings-pill" data-bg="sunrise">
            Sunrise
          </button>
          <button class="settings-pill" data-bg="glow">
            Glow
          </button>
        </div>
      </div>

      <div class="settings-section-title">Visual mode</div>
      <div class="settings-card">
        <div class="settings-pill-row">
          <button
            id="settings-fidelity-win11"
            class="settings-pill active"
          >
            Windows 11 Mode
          </button>
          <button
            id="settings-fidelity-classic"
            class="settings-pill"
          >
            Classic Mode
          </button>
        </div>
      </div>

      <div class="settings-section-title">Apps</div>
      <div class="settings-card">
        <div id="settings-app-list" class="settings-app-list"></div>
      </div>
    </div>

    <script>
      (function () {
        // window.parent is the OS shell; window here is just the iframe
        const os = window.parent.QA_OS || window.parent.OS || {};

        const brightness = document.getElementById("settings-brightness");
        const themeLight = document.getElementById("settings-theme-light");
        const themeDark = document.getElementById("settings-theme-dark");
        const bgPills = document.querySelectorAll(".settings-pill[data-bg]");
        const appList = document.getElementById("settings-app-list");

        const fidelityWin11 = document.getElementById("settings-fidelity-win11");
        const fidelityClassic = document.getElementById("settings-fidelity-classic");

        function init() {
          if (brightness) {
            brightness.addEventListener("input", () => {
              if (window.parent && window.parent.document) {
                const root = window.parent.document.documentElement;
                root.style.setProperty("--qa-brightness", brightness.value);
              }
            });
          }

          if (themeLight && themeDark) {
            themeLight.addEventListener("click", () => {
              setThemePills("light");
              os.setTheme && os.setTheme("light");
            });
            themeDark.addEventListener("click", () => {
              setThemePills("dark");
              os.setTheme && os.setTheme("dark");
            });
          }

          bgPills.forEach((pill) => {
            pill.addEventListener("click", () => {
              const bg = pill.getAttribute("data-bg");
              setBgPills(bg);
              os.setBackground && os.setBackground(bg);
            });
          });

          if (fidelityWin11 && fidelityClassic) {
            fidelityWin11.addEventListener("click", () => {
              setFidelityPills("win11");
              os.setFidelity && os.setFidelity("win11");
            });
            fidelityClassic.addEventListener("click", () => {
              setFidelityPills("classic");
              os.setFidelity && os.setFidelity("classic");
            });

            const current =
              (os.getFidelity && os.getFidelity()) || "win11";
            setFidelityPills(current);
          }

          renderApps();
        }

        function setThemePills(theme) {
          themeLight.classList.toggle("active", theme === "light");
          themeDark.classList.toggle("active", theme === "dark");
        }

        function setBgPills(bg) {
          bgPills.forEach((p) =>
            p.classList.toggle("active", p.getAttribute("data-bg") === bg),
          );
        }

        function setFidelityPills(mode) {
          const isWin11 = mode === "win11";
          fidelityWin11.classList.toggle("active", isWin11);
          fidelityClassic.classList.toggle("active", !isWin11);
        }

        function renderApps() {
          if (!appList || !os.installApp || !os.uninstallApp) return;

          const apps = [
            { id: "dynamics", label: "Dynamics" },
            { id: "ado", label: "Azure DevOps" },
            { id: "ac", label: "AC Panel" },
            { id: "training", label: "Training" },
            { id: "settings", label: "Settings" },
          ];

          appList.innerHTML = "";
          apps.forEach((app) => {
            const row = document.createElement("div");
            row.className = "settings-app-row";
            row.innerHTML = `
              <span>${app.label}</span>
              <button class="settings-toggle-btn" data-app="${app.id}">
                Toggle
              </button>
            `;
            const btn = row.querySelector("button");
            btn.addEventListener("click", () => {
              os.uninstallApp && os.uninstallApp(app.id);
              os.installApp && os.installApp(app.id);
              os.notify && os.notify("Toggled app: " + app.label);
            });
            appList.appendChild(row);
          });
        }

        init();
      })();
    </script>
  </body>
</html>
