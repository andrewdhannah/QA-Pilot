<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>Reports — QA Analytics</title>
        <style>
            :root {
                --rep-bg: #f3f2f1;
                --rep-surface: #ffffff;
                --rep-border: #d0d0d0;
                --rep-border-subtle: #e1dfdd;
                --rep-text: #201f1e;
                --rep-text-subtle: #605e5c;
                --rep-blue: #0078d4;
            }

            body.theme-dark {
                --rep-bg: #1b1a19;
                --rep-surface: #252423;
                --rep-border: #3b3a39;
                --rep-border-subtle: #3b3a39;
                --rep-text: #f3f2f1;
                --rep-text-subtle: #c8c6c4;
                --rep-blue: #3aa0ff;
            }

            body {
                margin: 0;
                font-family:
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    sans-serif;
                font-size: 13px;
                background: var(--rep-bg);
                color: var(--rep-text);
                height: 100vh;
                display: flex;
                flex-direction: column;
            }

            .rep-header {
                height: 36px;
                background: var(--rep-surface);
                border-bottom: 1px solid var(--rep-border-subtle);
                display: flex;
                align-items: center;
                padding: 0 10px;
                box-sizing: border-box;
            }

            .rep-header-title {
                font-size: 13px;
                font-weight: 600;
            }

            .rep-header-sub {
                font-size: 11px;
                color: var(--rep-text-subtle);
                margin-left: 8px;
            }

            .rep-header-right {
                margin-left: auto;
                font-size: 11px;
                color: var(--rep-text-subtle);
            }

            .rep-body {
                flex: 1;
                padding: 10px;
                box-sizing: border-box;
                overflow-y: auto;
            }

            .rep-row {
                display: flex;
                gap: 8px;
                margin-bottom: 8px;
            }

            .rep-card {
                background: var(--rep-surface);
                border: 1px solid var(--rep-border-subtle);
                border-radius: 2px;
                padding: 8px;
                box-sizing: border-box;
                font-size: 12px;
            }

            .rep-card-title {
                font-size: 12px;
                font-weight: 600;
                margin-bottom: 4px;
            }

            .rep-tile {
                flex: 1;
                text-align: left;
            }

            .rep-tile-label {
                font-size: 11px;
                color: var(--rep-text-subtle);
                margin-bottom: 2px;
            }

            .rep-tile-value {
                font-size: 20px;
                font-weight: 600;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                font-size: 12px;
            }

            th,
            td {
                padding: 4px 6px;
                border-bottom: 1px solid var(--rep-border-subtle);
            }

            th {
                text-align: left;
                background: rgba(0, 0, 0, 0.02);
            }

            .rep-hint {
                font-size: 11px;
                color: var(--rep-text-subtle);
                margin-top: 4px;
            }
        </style>
    </head>
    <body class="theme-light">
        <div class="rep-header">
            <div class="rep-header-title">Reports</div>
            <div class="rep-header-sub">QA Analytics</div>
            <div class="rep-header-right" id="rep-scenario-count">
                0 scenarios
            </div>
        </div>
        <div class="rep-body" id="rep-root">
            <!-- Filled by script -->
        </div>

        <script>
            (function () {
                const OS = window.parent.OS || window.parent.QA_OS;

                const state = {
                    theme: "light",
                };

                window.addEventListener("message", (event) => {
                    const msg = event.data;
                    if (
                        !msg ||
                        msg.type !== "APP_BOOT" ||
                        msg.appId !== "reports"
                    )
                        return;

                    state.theme = msg.theme || state.theme || "light";
                    applyTheme();
                    render();
                });

                function applyTheme() {
                    document.body.classList.remove("theme-light", "theme-dark");
                    document.body.classList.add(
                        state.theme === "dark" ? "theme-dark" : "theme-light",
                    );
                }

                function getAllScenarios() {
                    return window.SCENARIOS
                        ? Object.values(window.SCENARIOS)
                        : [];
                }

                function render() {
                    const root = document.getElementById("rep-root");
                    const scenarios = getAllScenarios();

                    const cases = scenarios.filter((s) => s.type === "case");
                    const bugs = scenarios.filter((s) => s.type === "bug");

                    const bugsBySeverity = {};
                    bugs.forEach((b) => {
                        const sev = b.severity || "Unknown";
                        bugsBySeverity[sev] = (bugsBySeverity[sev] || 0) + 1;
                    });

                    const casesByPriority = {};
                    cases.forEach((c) => {
                        const p = c.priority || "Unknown";
                        casesByPriority[p] = (casesByPriority[p] || 0) + 1;
                    });

                    const linkedCases = cases.filter((c) => c.linkedBug);
                    const unlinkedCases = cases.filter((c) => !c.linkedBug);
                    const linkedBugs = bugs.filter((b) => b.linkedCase);
                    const unlinkedBugs = bugs.filter((b) => !b.linkedCase);

                    const scenarioCountLabel =
                        document.getElementById("rep-scenario-count");
                    scenarioCountLabel.textContent =
                        scenarios.length + " scenarios";

                    root.innerHTML = `
            <div class="rep-row">
              <div class="rep-card rep-tile">
                <div class="rep-tile-label">Total Bugs</div>
                <div class="rep-tile-value">${bugs.length}</div>
              </div>
              <div class="rep-card rep-tile">
                <div class="rep-tile-label">Total Cases</div>
                <div class="rep-tile-value">${cases.length}</div>
              </div>
              <div class="rep-card rep-tile">
                <div class="rep-tile-label">Linked Bugs</div>
                <div class="rep-tile-value">${linkedBugs.length}</div>
              </div>
              <div class="rep-card rep-tile">
                <div class="rep-tile-label">Unlinked Cases</div>
                <div class="rep-tile-value">${unlinkedCases.length}</div>
              </div>
            </div>

            <div class="rep-row">
              <div class="rep-card" style="flex:1;">
                <div class="rep-card-title">Bugs by severity</div>
                ${renderTable(bugsBySeverity, "Severity")}
                <div class="rep-hint">Use this to talk about risk and prioritization.</div>
              </div>
              <div class="rep-card" style="flex:1;">
                <div class="rep-card-title">Cases by priority</div>
                ${renderTable(casesByPriority, "Priority")}
                <div class="rep-hint">Use this to talk about workload and triage.</div>
              </div>
            </div>

            <div class="rep-row">
              <div class="rep-card" style="flex:1;">
                <div class="rep-card-title">Case → Bug links</div>
                ${renderLinksTable(cases)}
              </div>
            </div>
          `;
                }

                function renderTable(obj, label) {
                    const entries = Object.entries(obj);
                    if (!entries.length) {
                        return '<div class="rep-hint">No data.</div>';
                    }
                    return `
            <table>
              <tr><th>${label}</th><th>Count</th></tr>
              ${entries
                  .map(
                      ([k, v]) =>
                          `<tr><td>${escapeHtml(k)}</td><td>${v}</td></tr>`,
                  )
                  .join("")}
            </table>
          `;
                }

                function renderLinksTable(cases) {
                    if (!cases.length) {
                        return '<div class="rep-hint">No cases loaded.</div>';
                    }
                    return `
            <table>
              <tr><th>Case ID</th><th>Title</th><th>Linked Bug</th></tr>
              ${cases
                  .map(
                      (c) => `
                  <tr>
                    <td>${escapeHtml(c.id || "")}</td>
                    <td>${escapeHtml(c.title || "")}</td>
                    <td>${escapeHtml(c.linkedBug || "None")}</td>
                  </tr>`,
                  )
                  .join("")}
            </table>
          `;
                }

                function escapeHtml(str) {
                    return String(str || "")
                        .replace(/&/g, "&amp;")
                        .replace(/</g, "&lt;")
                        .replace(/>/g, "&gt;")
                        .replace(/"/g, "&quot;");
                }
            })();
        </script>
    </body>
</html>
