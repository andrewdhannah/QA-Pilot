<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson 1: Testing 101 — QA Onboarding</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    /* ── LESSON SPECIFIC LAYOUT ──────────────────────────────────────────────── */
    .lesson-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 0;
      min-height: calc(100vh - 57px); /* full height minus topbar */
    }

    /* Sidebar */
    .chapter-sidebar {
      background: var(--color-surface);
      border-right: 1px solid var(--color-border);
      padding: var(--space-6);
      position: sticky;
      top: 57px;  /* topbar height */
      align-self: start;
      height: calc(100vh - 57px);
      overflow-y: auto;
    }
    .chapter-sidebar-title {
      font-size: var(--text-sm);
      font-weight: var(--weight-bold);
      color: var(--color-ink-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: var(--space-5);
    }
    .chapter-list { display: flex; flex-direction: column; gap: var(--space-2); }
    .chapter-list-item {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-sm);
      font-size: var(--text-sm);
      color: var(--color-ink-muted);
      cursor: default;
      transition: background var(--transition-fast);
    }
    .chapter-list-item.current {
      background: var(--color-primary-light);
      color: var(--color-primary);
      font-weight: var(--weight-medium);
    }
    .chapter-list-item.complete {
      color: var(--color-success);
      cursor: pointer;
    }
    .chapter-list-item.complete:hover { background: var(--color-success-light); }
    .chapter-check { font-size: 12px; }

    /* Main content */
    .chapter-main {
      padding: var(--space-10) var(--space-12);
      max-width: 720px;
    }
    .chapter-progress-bar {
      height: 4px;
      background: var(--color-border);
      border-radius: var(--radius-full);
      margin-bottom: var(--space-2);
    }
    .chapter-progress-fill {
      height: 100%;
      background: var(--color-primary);
      border-radius: var(--radius-full);
      transition: width var(--transition-slow);
    }
    .chapter-label {
      font-size: var(--text-xs);
      color: var(--color-ink-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: var(--space-8);
    }
    .chapter-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: var(--space-10);
      padding-top: var(--space-6);
      border-top: 1px solid var(--color-border);
    }
    .chapter-timer-notice {
      font-size: var(--text-xs);
      color: var(--color-ink-muted);
      font-style: italic;
    }

    /* Lesson content typography */
    .chapter-content h1 {
      font-size: var(--text-xl);
      font-weight: var(--weight-bold);
      color: var(--color-ink);
      margin-bottom: var(--space-2);
    }
    .chapter-content .chapter-intro {
      font-size: var(--text-md);
      color: var(--color-ink-muted);
      margin-bottom: var(--space-8);
      line-height: var(--leading-loose);
    }
    .chapter-content p {
      color: var(--color-ink-soft);
      margin-bottom: var(--space-5);
      line-height: var(--leading-base);
    }
    .callout {
      background: var(--color-primary-light);
      border-left: 4px solid var(--color-primary);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: var(--space-4) var(--space-5);
      margin: var(--space-6) 0;
      font-size: var(--text-sm);
      color: var(--color-ink);
      font-style: italic;
    }
    .callout strong { color: var(--color-primary); font-style: normal; }
    .comparison-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-4);
      margin: var(--space-6) 0;
    }
    .comparison-card {
      padding: var(--space-4);
      border-radius: var(--radius-sm);
      font-size: var(--text-sm);
    }
    .comparison-card.bad  { background: var(--color-error-light);   border: 1px solid var(--color-error-border);   }
    .comparison-card.good { background: var(--color-success-light); border: 1px solid var(--color-success-border); }
    .comparison-label { font-weight: var(--weight-bold); margin-bottom: var(--space-2); }
    .comparison-card.bad  .comparison-label { color: var(--color-error);   }
    .comparison-card.good .comparison-label { color: var(--color-success); }
    
    /* Quiz phase styles - preserved from original */
    .quiz-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: var(--space-8);
      text-align: center;
      max-width: 720px;
      margin: 0 auto;
    }
    .answer-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-4);
      margin: var(--space-6) 0;
    }
    @media (max-width: 480px) {
      .answer-grid { grid-template-columns: 1fr; }
    }
    .btn-answer {
      padding: var(--space-6);
      font-size: var(--text-lg);
      border: 2px solid var(--color-border);
      background: var(--color-surface);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .btn-answer.correct {
      border-color: var(--color-success);
      background: var(--color-success-light);
      color: var(--color-success);
    }
    .btn-answer.incorrect {
      border-color: var(--color-error);
      background: var(--color-error-light);
      color: var(--color-error);
    }
    .feedback-panel {
      margin-top: var(--space-6);
      padding: var(--space-6);
      border-radius: var(--radius-md);
      text-align: left;
      display: none;
    }
    .feedback-panel.visible { display: block; }
    .feedback-correct { background: var(--color-success-light); border: 1px solid var(--color-success-border); }
    .feedback-incorrect { background: var(--color-error-light); border: 1px solid var(--color-error-border); }

    .result-row {
      display: flex;
      gap: var(--space-4);
      padding: var(--space-4);
      border-bottom: 1px solid var(--color-border);
      align-items: flex-start;
    }
    .result-row:last-child { border-bottom: none; }
    .result-icon { font-size: var(--text-lg); }
    .result-details { flex: 1; }
    .explanation-toggle {
      font-size: var(--text-xs);
      color: var(--color-primary);
      cursor: pointer;
      text-decoration: underline;
      margin-top: var(--space-2);
      display: block;
    }
    .explanation-text {
      font-size: var(--text-sm);
      color: var(--color-ink-soft);
      margin-top: var(--space-2);
      display: none;
    }
    #phase-results {
      padding: var(--space-10) var(--space-12);
      max-width: 720px;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <nav class="topbar flex justify-between items-center">
    <div class="topbar-brand">QA Onboarding Training</div>
    <div class="topbar-progress-indicator" id="topbar-pips"></div>
    <div class="topbar-user flex items-center gap-4">
      <span id="user-name-display"></span>
      <button class="btn btn-ghost" onclick="handleLogout()">Sign Out</button>
    </div>
  </nav>

  <!-- PHASE 1: LEARNING CONTENT -->
  <div id="phase-content" class="lesson-layout">
    <aside class="chapter-sidebar">
      <div class="chapter-sidebar-title">Lesson 1 — Testing 101</div>
      <nav class="chapter-list" id="chapter-list">
        <!-- Injected by buildSidebar() -->
      </nav>
    </aside>

    <main class="chapter-main">
      <div class="chapter-progress-bar">
        <div class="chapter-progress-fill" id="chapter-progress-fill"></div>
      </div>
      <div class="chapter-label" id="chapter-label">Chapter 1 of 5</div>
      <div id="chapter-content"></div>

      <div class="chapter-nav">
        <button class="btn btn-ghost" id="btn-prev" onclick="prevChapter()">← Previous</button>
        <div id="chapter-timer-notice" class="chapter-timer-notice"></div>
        <button class="btn btn-primary" id="btn-next" onclick="nextChapter()">Next →</button>
      </div>
    </main>
  </div>

  <!-- PHASE 2: THE QUIZ -->
  <div id="phase-quiz" style="display: none;">
    <div class="quiz-card">
      <span class="label-caps" id="quiz-progress">Question 1 of 5</span>
      <p id="quiz-question-text" class="text-md font-medium my-6"></p>
      
      <div class="answer-grid">
        <button class="btn-answer" onclick="handleAnswer('True')">True</button>
        <button class="btn-answer" onclick="handleAnswer('False')">False</button>
      </div>

      <div id="quiz-feedback" class="feedback-panel">
        <div id="feedback-title" class="font-bold mb-2"></div>
        <div id="feedback-body" class="text-sm"></div>
        <div class="footer-nav" style="justify-content: center; margin-top: var(--space-6);">
          <button class="btn btn-primary" id="btn-next-q" onclick="nextQuestion()">Next question → </button>
        </div>
      </div>
    </div>
  </div>

  <!-- PHASE 3: THE RESULTS -->
  <div id="phase-results" style="display: none;">
    <div class="quiz-card" style="text-align: left;">
      <h2 class="text-lg font-bold text-center">Quiz Complete</h2>
      <p id="score-text" class="text-center font-bold my-4"></p>
      
      <div id="results-list" class="my-6">
        <!-- Per-question results -->
      </div>

      <div class="footer-nav" style="justify-content: center;">
        <button class="btn btn-primary" onclick="completeLesson()">Complete Lesson</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="data/content.js"></script>
  <script src="data/quiz-questions.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>

  <script>
    /**
     * lesson-1.html — Page Logic
     * ==========================
     * WHAT THIS PAGE DOES:
     * - Provides a multi-chapter guided learning experience for "Testing 101".
     * - Tracks time spent per lesson and marks chapters as read in IndexedDB.
     * - Transitions to a True/False quiz upon completion of all reading.
     *
     * FLOW:
     * 1. initDB() opens connection.
     * 2. requireLogin() ensures user is authenticated.
     * 3. Page checks if lesson-1 is already complete (redirects if so).
     * 4. Page resumes from the first unread chapter.
     * 5. User reads through 5 chapters (15s lock per chapter).
     * 6. User takes the quiz, views results, and triggers completeLesson().
     *
     * READS FROM:   IndexedDB via db.js
     * WRITES TO:    IndexedDB via db.js
     * REDIRECTS TO: index.html (logout), course.html (completion)
     */

    // ── SECTION 1: PAGE STATE ──────────────────────────────────────────────────

    var currentSession  = null;   // CaseId and role
    var currentStudent  = null;   // Full student record
    var currentProgress = null;   // Progress record
    var currentChapter  = 0;      // 0-based index
    var lessonTimer     = null;   // Timer handle
    var lessonSeconds   = 0;      // Cumulative seconds for this session

    // Quiz state
    var quizQuestions   = [];
    var currentQuestion = 0;
    var quizAnswers     = [];

    // ── SECTION 2: CHAPTER DEFINITIONS ────────────────────────────────────────

    var CHAPTER_1 = `
    <div class="chapter-content">
      <h1>What Is Software Testing, and Why Does It Exist?</h1>
      <p class="chapter-intro">Before we talk about how to test, it helps to understand why testing exists at all.</p>
      <p>Imagine you write a feature that calculates an invoice total. It works perfectly on your machine. You ship it. Three days later, a client's invoice comes out to $0.00. The developer checked it. The designer reviewed it. Nobody tested it under the specific conditions that exposed the bug. That's what testers are for.</p>
      <p><strong>Software testing</strong> is the systematic process of checking that software does what it is supposed to do — and does <em>not</em> do what it is not supposed to do. Both halves of that sentence matter equally.</p>
      <h2 style="margin: var(--space-6) 0 var(--space-3);">Verification vs. Validation</h2>
      <p>These two words sound similar but mean different things in QA:</p>
      <ul style="padding-left:var(--space-5); color:var(--color-ink-soft); margin-bottom:var(--space-5);">
        <li style="margin-bottom:var(--space-3);"><strong>Verification</strong> — Did we build it right? Does the software match its technical specification?</li>
        <li style="margin-bottom:var(--space-3);"><strong>Validation</strong> — Did we build the right thing? Does the software actually solve the user's real problem?</li>
      </ul>
      <p>A feature can pass verification and fail validation. Good QA catches both.</p>
      <h2 style="margin: var(--space-6) 0 var(--space-3);">Why Can't Developers Test Their Own Code?</h2>
      <p>They can — and should. But developers make poor end-to-end testers of their own work due to <strong>Proximity bias</strong> (testing only the intended path) and <strong>Assumption blindness</strong> (using the software "correctly" because they know how it works).</p>
      <!-- SVG: Bar chart — relative cost of finding a bug at each stage of the cycle -->
      <!-- Heights are visual/proportional (log-inspired), not mathematically exact -->
      <svg viewBox="0 0 700 270" xmlns="http://www.w3.org/2000/svg" style="width:100%; margin:var(--space-6) 0; border-radius:8px; background:#f8fafc; display:block;">
        <!-- Chart title -->
        <text x="350" y="28" text-anchor="middle" font-family="inherit" font-size="14" font-weight="700" fill="#0f172a">The Cost of a Bug at Each Stage</text>
        <text x="350" y="46" text-anchor="middle" font-family="inherit" font-size="11" fill="#8892a4">The later a bug is caught, the more expensive it is to fix</text>
        <!-- Y-axis line -->
        <line x1="100" y1="40" x2="100" y2="222" stroke="#e2e8f0" stroke-width="1.5"/>
        <!-- Baseline -->
        <line x1="100" y1="222" x2="630" y2="222" stroke="#e2e8f0" stroke-width="2"/>
        <!-- Y-axis label -->
        <text x="88" y="224" text-anchor="end" font-family="inherit" font-size="10" fill="#8892a4">$</text>
        <text x="88" y="50" text-anchor="end" font-family="inherit" font-size="10" fill="#8892a4">$$$</text>
        <!-- Bar 1: Development — 1× cost (green) -->
        <rect x="130" y="192" width="80" height="30" fill="#16a34a" rx="4"/>
        <text x="170" y="184" text-anchor="middle" font-family="inherit" font-size="12" font-weight="700" fill="#16a34a">1×</text>
        <text x="170" y="240" text-anchor="middle" font-family="inherit" font-size="11" fill="#0f172a" font-weight="600">Development</text>
        <!-- Bar 2: QA — 5× cost (amber) -->
        <rect x="250" y="142" width="80" height="80" fill="#d97706" rx="4"/>
        <text x="290" y="134" text-anchor="middle" font-family="inherit" font-size="12" font-weight="700" fill="#d97706">5×</text>
        <text x="290" y="240" text-anchor="middle" font-family="inherit" font-size="11" fill="#0f172a" font-weight="600">QA</text>
        <!-- Bar 3: UAT — 15× cost (orange) -->
        <rect x="370" y="92" width="80" height="130" fill="#ea580c" rx="4"/>
        <text x="410" y="84" text-anchor="middle" font-family="inherit" font-size="12" font-weight="700" fill="#ea580c">15×</text>
        <text x="410" y="240" text-anchor="middle" font-family="inherit" font-size="11" fill="#0f172a" font-weight="600">UAT</text>
        <!-- Bar 4: Production — 100× cost (red) -->
        <rect x="490" y="42" width="80" height="180" fill="#dc2626" rx="4"/>
        <text x="530" y="34" text-anchor="middle" font-family="inherit" font-size="13" font-weight="700" fill="#dc2626">100×</text>
        <text x="530" y="240" text-anchor="middle" font-family="inherit" font-size="11" fill="#0f172a" font-weight="600">Production</text>
        <!-- Source note -->
        <text x="350" y="260" text-anchor="middle" font-family="inherit" font-size="10" fill="#8892a4">Based on IBM Systems Sciences Institute research — relative cost multipliers by phase</text>
      </svg>
      <div class="callout"><strong>Key takeaway:</strong> A tester's job is not to break software. It is to find out what reality is, and compare it honestly against what was promised.</div>
    </div>`;

    var CHAPTER_2 = `
    <div class="chapter-content">
      <h1>Agile and Where You Fit</h1>
      <p class="chapter-intro">Understanding the process around you makes you a better tester. Here's how Agile works and where your role sits inside it.</p>
      <!-- System Tester role callout — added so the team understands their specific title -->
      <div class="callout" style="margin-bottom:var(--space-5);">
        <strong>Your role: System Tester.</strong> You verify that the full application works end-to-end — that every feature behaves exactly as the Acceptance Criteria specify. This is called <em>System Testing</em>. UAT (User Acceptance Testing) comes after you and is performed by the client or business owners. Your job is to catch issues <em>before</em> they ever reach UAT.
      </div>
      <h2 style="margin: var(--space-6) 0 var(--space-3);">What Is Agile?</h2>
      <p>Agile is a way of building software in short, focused cycles called <strong>sprints</strong> — usually one to two weeks long.</p>
      <!-- SVG: Agile Sprint Cycle — 5 pill-shaped nodes with a dashed return arc -->
      <!-- The Test node is slightly larger and highlighted — this is where QA sits -->
      <!-- Marker IDs use unique prefix "l1ch2" to avoid collisions with other chapter SVGs -->
      <svg viewBox="0 0 700 185" xmlns="http://www.w3.org/2000/svg" style="width:100%; margin:var(--space-6) 0; border-radius:8px; background:#f8fafc; display:block;">
        <defs>
          <!-- Forward arrow marker (points right) -->
          <marker id="l1ch2-fwd" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#8892a4"/>
          </marker>
          <!-- Return arc arrow marker (points left, toward Plan) -->
          <marker id="l1ch2-back" markerWidth="8" markerHeight="8" refX="1" refY="3" orient="auto">
            <path d="M8,0 L8,6 L0,3 z" fill="#8892a4"/>
          </marker>
        </defs>
        <!-- Diagram title and subtitle -->
        <text x="350" y="22" text-anchor="middle" font-family="inherit" font-size="13" font-weight="700" fill="#0f172a">The Agile Sprint Cycle</text>
        <text x="350" y="38" text-anchor="middle" font-family="inherit" font-size="10" fill="#8892a4">Each sprint is 1–2 weeks. QA testing runs throughout — not just at the end.</text>
        <!-- Forward connector arrows between pills -->
        <line x1="141" y1="82" x2="158" y2="82" stroke="#8892a4" stroke-width="1.5" marker-end="url(#l1ch2-fwd)"/>
        <line x1="281" y1="82" x2="298" y2="82" stroke="#8892a4" stroke-width="1.5" marker-end="url(#l1ch2-fwd)"/>
        <line x1="421" y1="82" x2="438" y2="82" stroke="#8892a4" stroke-width="1.5" marker-end="url(#l1ch2-fwd)"/>
        <line x1="561" y1="82" x2="578" y2="82" stroke="#8892a4" stroke-width="1.5" marker-end="url(#l1ch2-fwd)"/>
        <!-- Dashed return arc — Release looping back to Plan for next sprint -->
        <path d="M 668,100 C 678,150 678,162 350,162 C 22,162 22,150 32,100"
              stroke="#8892a4" stroke-width="1.5" fill="none" stroke-dasharray="5,3"
              marker-end="url(#l1ch2-back)"/>
        <text x="350" y="178" text-anchor="middle" font-family="inherit" font-size="10" fill="#8892a4">↺  start next sprint</text>
        <!-- Pill 1: Plan (blue) -->
        <rect x="20" y="60" width="120" height="44" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
        <text x="80" y="87" text-anchor="middle" font-family="inherit" font-size="12" font-weight="700" fill="#2563eb">Plan</text>
        <!-- Pill 2: Develop (purple) -->
        <rect x="160" y="60" width="120" height="44" rx="22" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
        <text x="220" y="87" text-anchor="middle" font-family="inherit" font-size="12" font-weight="700" fill="#7c3aed">Develop</text>
        <!-- Pill 3: Test (amber) — slightly taller to emphasise this is QA's stage -->
        <rect x="300" y="54" width="120" height="56" rx="28" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
        <text x="360" y="80" text-anchor="middle" font-family="inherit" font-size="12" font-weight="700" fill="#d97706">Test</text>
        <text x="360" y="96" text-anchor="middle" font-family="inherit" font-size="9" fill="#d97706">← you are here</text>
        <!-- Pill 4: Review (green) -->
        <rect x="440" y="60" width="120" height="44" rx="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
        <text x="500" y="87" text-anchor="middle" font-family="inherit" font-size="12" font-weight="700" fill="#16a34a">Review</text>
        <!-- Pill 5: Release (teal) -->
        <rect x="580" y="60" width="100" height="44" rx="22" fill="#f0f9ff" stroke="#0891b2" stroke-width="1.5"/>
        <text x="630" y="87" text-anchor="middle" font-family="inherit" font-size="12" font-weight="700" fill="#0891b2">Release</text>
      </svg>
      <h2 style="margin: var(--space-6) 0 var(--space-3);">Agile vs. Waterfall Testing</h2>
      <div class="comparison-grid">
        <div class="comparison-card bad">
          <div class="comparison-label">❌ Waterfall</div>
          All development finishes first. Then testing begins. The gap is long. Bugs found late are expensive to fix.
        </div>
        <div class="comparison-card good">
          <div class="comparison-label">✓ Agile</div>
          Testing runs alongside development every sprint. Issues surface early when they're cheap to fix.
        </div>
      </div>
      <h2 style="margin: var(--space-6) 0 var(--space-3);">What Is UAT?</h2>
      <p><strong>User Acceptance Testing (UAT)</strong> is the final check before a feature ships. It answers: does this do what the business agreed it would do?</p>
      <div class="callout"><strong>Key takeaway:</strong> In Agile, you are not a gatekeeper at the end of the line. You are a quality signal throughout the whole process.</div>
    </div>`;

    var CHAPTER_3 = `
    <div class="chapter-content">
      <h1>Types of Testing</h1>
      <p class="chapter-intro">There are many kinds of testing. Knowing which type does what helps you understand where your work fits in the bigger picture.</p>
      <table style="width:100%; border-collapse:collapse; margin:var(--space-6) 0; font-size:var(--text-sm);">
        <thead style="background:var(--color-bg); border-bottom:2px solid var(--color-border);">
          <tr>
            <th style="text-align:left; padding:var(--space-3) var(--space-4); color:var(--color-ink-muted); font-size:var(--text-xs); text-transform:uppercase;">Type</th>
            <th style="text-align:left; padding:var(--space-3) var(--space-4); color:var(--color-ink-muted); font-size:var(--text-xs); text-transform:uppercase;">What It Tests</th>
            <th style="text-align:left; padding:var(--space-3) var(--space-4); color:var(--color-ink-muted); font-size:var(--text-xs); text-transform:uppercase;">Analogy</th>
          </tr>
        </thead>
        <tbody>

      panel.className = 'feedback-panel visible ' + (isCorrect ? 'feedback-correct' : 'feedback-incorrect');

            <div class="font-medium text-sm">${q.questionText}</div>
            ${!ans.correct ? `<div class="text-xs text-muted">Correct: ${q.correctAnswer}</div>` : ''}
            <span class="explanation-toggle" onclick="toggleExp(this)">Show explanation</span>
            <div class="explanation-text">${q.explanation}</div>
          </div>
        `;
        list.appendChild(row);
      });
    }

    function toggleExp(el) {
      const text = el.nextElementSibling;
      const isHidden = text.style.display === 'none' || text.style.display === '';
      text.style.display = isHidden ? 'block' : 'none';
      el.textContent = isHidden ? 'Hide explanation' : 'Show explanation';
    }

    async function completeLesson() {
      try {
        const progress = await getProgress(currentSession.caseId);
        const now = new Date().toISOString();

        // Save total time spent including the final remaining seconds
        var remainder = lessonSeconds % 30;
        if (remainder > 0) await addTimeSpent(currentSession.caseId, 'lesson-1', remainder);

        const results = {};
        quizAnswers.forEach(ans => {
          results[ans.questionId] = {
            selectedAnswer: ans.selectedAnswer,
            correct: ans.correct,
            answeredAt: now
          };
        });

        const updatedProgress = progress || {
          caseId: currentSession.caseId,
          lessonsComplete: [],
          currentLesson: 'lesson-1',
          quizResults: {},
          placementSurvey: { completed: true, recommendedPath: [], answers: [] },
          certificateEarned: false,
        };

        updatedProgress.quizResults['lesson-1'] = results;
        if (!updatedProgress.lessonsComplete.includes('lesson-1')) {
          updatedProgress.lessonsComplete.push('lesson-1');
        }
        updatedProgress.lastActivity = now;

        await saveProgress(updatedProgress);
        window.location.href = 'course.html';
      } catch (e) {
        console.error(e);
        showToast('Error saving progress', 'error');
      }
    }

    function handleLogout() {
      var remainder = lessonSeconds % 30;
      if (remainder > 0 && currentSession) addTimeSpent(currentSession.caseId, 'lesson-1', remainder);
      endSession();
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
