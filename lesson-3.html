<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson 3: Dynamics CRM Mock — QA Training</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/dynamics-mock.css">
  <style>
    /* ── LESSON SPECIFIC LAYOUT ──────────────────────────────────────────────── */
    .lesson-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 0;
      min-height: calc(100vh - 57px);
    }
    .chapter-sidebar {
      background: var(--color-surface);
      border-right: 1px solid var(--color-border);
      padding: var(--space-6);
      position: sticky;
      top: 57px;
      align-self: start;
      height: calc(100vh - 57px);
      overflow-y: auto;
    }
    .chapter-sidebar-title {
      font-size: var(--text-sm);
      font-weight: var(--weight-bold);
      color: var(--color-ink-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: var(--space-5);
    }
    .chapter-list { display: flex; flex-direction: column; gap: var(--space-2); }
    .chapter-list-item {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-sm);
      font-size: var(--text-sm);
      color: var(--color-ink-muted);
      cursor: default;
      transition: background var(--transition-fast);
    }
    .chapter-list-item.current {
      background: var(--color-primary-light);
      color: var(--color-primary);
      font-weight: var(--weight-medium);
    }
    .chapter-list-item.complete {
      color: var(--color-success);
      cursor: pointer;
    }
    .chapter-list-item.complete:hover { background: var(--color-success-light); }
    .chapter-check { font-size: 12px; }
    .chapter-main {
      padding: var(--space-10) var(--space-12);
      max-width: 720px;
    }
    .chapter-progress-bar {
      height: 4px;
      background: var(--color-border);
      border-radius: var(--radius-full);
      margin-bottom: var(--space-2);
    }
    .chapter-progress-fill {
      height: 100%;
      background: var(--color-primary);
      border-radius: var(--radius-full);
      transition: width var(--transition-slow);
    }
    .chapter-label {
      font-size: var(--text-xs);
      color: var(--color-ink-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: var(--space-8);
    }
    .chapter-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: var(--space-10);
      padding-top: var(--space-6);
      border-top: 1px solid var(--color-border);
    }
    .chapter-timer-notice {
      font-size: var(--text-xs);
      color: var(--color-ink-muted);
      font-style: italic;
    }
    .chapter-content h1 {
      font-size: var(--text-xl);
      font-weight: var(--weight-bold);
      color: var(--color-ink);
      margin-bottom: var(--space-2);
    }
    .chapter-content .chapter-intro {
      font-size: var(--text-md);
      color: var(--color-ink-muted);
      margin-bottom: var(--space-8);
      line-height: var(--leading-loose);
    }
    .chapter-content p {
      color: var(--color-ink-soft);
      margin-bottom: var(--space-5);
      line-height: var(--leading-base);
    }
    .callout {
      background: var(--color-primary-light);
      border-left: 4px solid var(--color-primary);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: var(--space-4) var(--space-5);
      margin: var(--space-6) 0;
      font-size: var(--text-sm);
      color: var(--color-ink);
      font-style: italic;
    }
    .callout strong { color: var(--color-primary); font-style: normal; }
    .comparison-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-4);
      margin: var(--space-6) 0;
    }
    .comparison-card {
      padding: var(--space-4);
      border-radius: var(--radius-sm);
      font-size: var(--text-sm);
    }
    .comparison-card.bad  { background: var(--color-error-light);   border: 1px solid var(--color-error-border);   }
    .comparison-card.good { background: var(--color-success-light); border: 1px solid var(--color-success-border); }
    .comparison-label { font-weight: var(--weight-bold); margin-bottom: var(--space-2); }
    .comparison-card.bad  .comparison-label { color: var(--color-error);   }
    .comparison-card.good .comparison-label { color: var(--color-success); }
    
    .quiz-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: var(--space-8);
      text-align: center;
      max-width: 720px;
      margin: 0 auto;
    }
    .answer-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-4);
      margin: var(--space-6) 0;
    }
    .btn-answer {
      padding: var(--space-6);
      font-size: var(--text-base);
      border: 2px solid var(--color-border);
      background: var(--color-surface);
      border-radius: var(--radius-md);
      cursor: pointer;
      text-align: left;
      transition: all var(--transition-fast);
    }
    .btn-answer.correct {
      border-color: var(--color-success);
      background: var(--color-success-light);
      color: var(--color-success);
    }
    .btn-answer.incorrect {
      border-color: var(--color-error);
      background: var(--color-error-light);
      color: var(--color-error);
    }
    .feedback-panel {
      margin-top: var(--space-6);
      padding: var(--space-6);
      border-radius: var(--radius-md);
      text-align: left;
      display: none;
    }
    .feedback-panel.visible { display: block; }
    .feedback-correct { background: var(--color-success-light); border: 1px solid var(--color-success-border); }
    .feedback-incorrect { background: var(--color-error-light); border: 1px solid var(--color-error-border); }

    .result-row {
      display: flex;
      gap: var(--space-4);
      padding: var(--space-4);
      border-bottom: 1px solid var(--color-border);
      align-items: flex-start;
    }
    .result-icon { font-size: var(--text-lg); }
    .result-details { flex: 1; }
    .explanation-toggle {
      font-size: var(--text-xs);
      color: var(--color-primary);
      cursor: pointer;
      text-decoration: underline;
      margin-top: var(--space-2);
      display: block;
    }
    .explanation-text {
      font-size: var(--text-sm);
      color: var(--color-ink-soft);
      margin-top: var(--space-2);
      display: none;
    }
    #phase-results {
      padding: var(--space-10) var(--space-12);
      max-width: 720px;
      margin: 0 auto;
    }

    .ac-ref-panel {
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      margin-bottom: var(--space-6);
      overflow: hidden;
    }
    .ac-ref-header {
      padding: var(--space-3) var(--space-4);
      background: var(--color-surface);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--color-border);
    }
    .ac-ref-body {
      padding: var(--space-6);
      display: none;
      font-size: var(--text-sm);
      color: var(--color-ink-soft);
    }
    .ac-ref-body.visible { display: block; }
  </style>
</head>

      </nav>

      <div class="chapter-progress-bar">

      </div>
    </main>
  </div>

        </div>
        <div id="ac-ref-body" class="ac-ref-body">
          <!-- Injected by buildACReference() -->
        </div>
      </div>

      <span class="label-caps" id="quiz-progress">Question 1 of 5</span>
      <p id="quiz-question-text" class="text-md font-medium my-6"></p>
      
      <div class="answer-grid" id="quiz-options">
        <!-- Injected by renderQuestion() -->
      </div>

      <div id="quiz-feedback" class="feedback-panel">
        <div id="feedback-title" class="font-bold mb-2"></div>
        <div id="feedback-body" class="text-sm"></div>
        <div class="footer-nav" style="justify-content: center; margin-top: var(--space-6);">
          <button class="btn btn-primary" id="btn-next-q" onclick="nextQuestion()">Next question → </button>
        </div>
      </div>
    </div>
  </div>

  <!-- PHASE 3: THE RESULTS -->
  <div id="phase-results" style="display: none;">
    <div class="quiz-card" style="text-align: left;">
      <h2 class="text-lg font-bold text-center">Quiz Complete</h2>
      <p id="score-text" class="text-center font-bold my-4"></p>
      
      <div id="results-list" class="my-6">
        <!-- Per-question results -->
      </div>

      <div class="footer-nav" style="justify-content: center;">
        <button class="btn btn-primary" onclick="completeLesson()">Complete Lesson</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="data/quiz-questions.js"></script>

        if (index === 3) setupMock();
        
        var btnNext = document.getElementById('btn-next');
        btnNext.disabled = true;
        document.getElementById('chapter-timer-notice').textContent = 'Please take a moment to read before continuing.';
        setTimeout(function() {
          btnNext.disabled = false;
          document.getElementById('chapter-timer-notice').textContent = '';
        }, MIN_READ_SECONDS * 1000);
      }
      document.getElementById('btn-prev').disabled = (index === 0);
      buildSidebar();
      renderTopbarPips();
    }

    async function nextChapter() {
      var chapter = CHAPTERS[currentChapter];
      if (chapter.type === 'content') await saveChapterRead(currentSession.caseId, 'lesson-3', chapter.id);
      if (currentChapter < CHAPTERS.length - 1) showChapter(currentChapter + 1);
    }

    function prevChapter() { if (currentChapter > 0) showChapter(currentChapter - 1); }

    function goToChapter(index) {
      var chaptersRead = (currentProgress && currentProgress.chaptersRead && currentProgress.chaptersRead['lesson-3']) || [];
      if (chaptersRead.includes(CHAPTERS[index].id)) showChapter(index);
    }

    function buildSidebar() {
      var chaptersRead = (currentProgress && currentProgress.chaptersRead && currentProgress.chaptersRead['lesson-3']) || [];
      var list = document.getElementById('chapter-list');
      list.innerHTML = '';
      CHAPTERS.forEach(function(chapter, i) {
        var isComplete = chaptersRead.includes(chapter.id);
        var isCurrent  = (i === currentChapter);
        var item = document.createElement('div');
        item.className = 'chapter-list-item' + (isCurrent ? ' current' : '') + (isComplete ? ' complete' : '');
        if (isComplete && !isCurrent) item.onclick = function() { goToChapter(i); };
        item.innerHTML = '<span class="chapter-check">' + (isComplete ? '✓' : (isCurrent ? '▶' : '○')) + '</span><span>' + chapter.title + '</span>';
        list.appendChild(item);
      });
    }

    function startLessonTimer() {
      lessonTimer = setInterval(function() {
        lessonSeconds++;
        if (lessonSeconds % 30 === 0) addTimeSpent(currentSession.caseId, 'lesson-3', 30);
      }, 1000);
      window.addEventListener('beforeunload', function() {
        var remainder = lessonSeconds % 30;
        if (remainder > 0) addTimeSpent(currentSession.caseId, 'lesson-3', remainder);
      });
    }

    // ── SECTION 5: MOCK CRM LOGIC ─────────────────────────────────────────────

    function setupMock() {
      const content = loadContent();
      document.getElementById('breadcrumb').textContent = `Cases > Case List > ${currentSession.caseId}`;
      document.getElementById('user-avatar').textContent = currentStudent.name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0,2);
      
      document.getElementById('lbl-caseTitle').textContent = content.fieldLabels.caseTitle;
      document.getElementById('lbl-status').textContent = content.fieldLabels.status;
      document.getElementById('lbl-priority').textContent = content.fieldLabels.priority;
      document.getElementById('lbl-dateOpened').textContent = content.fieldLabels.dateOpened;
      document.getElementById('lbl-notes').textContent = content.fieldLabels.investigationNotes;
      document.getElementById('lbl-escalated').textContent = content.fieldLabels.escalated;
      document.getElementById('lbl-reason').textContent = content.fieldLabels.escalationReason;
      document.getElementById('lbl-outcome').textContent = content.fieldLabels.outcome;
      document.getElementById('lbl-assignedTo').textContent = content.fieldLabels.assignedTo;

      populateSelect('field-status', content.dropdownOptions.status);
      populateSelect('field-priority', content.dropdownOptions.priority);
      populateSelect('field-reason', content.dropdownOptions.escalationReason);

      document.getElementById('side-caseid').textContent = currentSession.caseId;
      document.getElementById('side-assigned').textContent = currentStudent.name;
      document.getElementById('side-role').textContent = content.roleNames[activeRole];
      document.getElementById('field-dateOpened').value = getTodayString();
      document.getElementById('side-date').textContent = getTodayString();
      
      applyRoleVisibility(activeRole);
      addTimelineEntry("Case opened");
      updateSidebarStatus();

      document.getElementById('field-status').addEventListener('change', updateSidebarStatus);
      document.getElementById('field-escalated').addEventListener('change', function() {
        document.getElementById('div-escalationReason').style.display = this.checked ? 'block' : 'none';
      });
      renderACs();
    }

    function toggleRole() {
      activeRole = (activeRole === 'junior') ? 'senior' : 'junior';
      var label = activeRole === 'senior' ? 'Senior Investigator' : 'Junior Investigator';
      document.getElementById('active-role-label').textContent = label;
      document.getElementById('side-role').textContent = label;
      applyRoleVisibility(activeRole);
      showToast('Role switched to: ' + label, 'default');
    }

    function applyRoleVisibility(role) {
      const isSenior = role === 'senior';
      document.getElementById('div-senior-fields').style.display = isSenior ? 'block' : 'none';
    }

    function populateSelect(id, options) {
      const sel = document.getElementById(id);
      sel.innerHTML = '';
      options.forEach(opt => {
        const o = document.createElement('option');
        o.value = opt; o.textContent = opt;
        sel.appendChild(o);
      });
    }

    function updateSidebarStatus() {
      const status = document.getElementById('field-status').value;
      document.getElementById('side-status-text').textContent = status;
      const dot = document.getElementById('side-status-dot');
      dot.className = 'dyn-status-dot';
      const colorMap = { 'Open': 'var(--status-open)', 'In Progress': 'var(--status-in-progress)', 'Pending Review': 'var(--status-pending)', 'Resolved': 'var(--status-resolved)', 'Closed': 'var(--status-closed)' };
      dot.style.backgroundColor = colorMap[status] || 'grey';
    }

    function addTimelineEntry(text) {
      const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      const list = document.getElementById('timeline');
      const div = document.createElement('div');
      div.className = 'dyn-timeline-entry';
      div.textContent = `[${time}] ${text}`;
      list.appendChild(div);
    }

    function renderACs() {
      const content = loadContent();
      const acs = [
        `AC-1.2: Outcome/Resolution visible ONLY to Senior Investigators. Absent from DOM for Juniors.`,
        `AC-2.1: Case Title is required. Save is blocked if blank.`,
        `AC-2.2: Case Title max 120 chars. 121st not accepted.`,
        `AC-3.4: When the Escalated checkbox is checked, the Escalation Reason dropdown must appear.`,
        `AC-4.2: Junior Investigators cannot set Status to Resolved or Closed. Save is blocked with: "You do not have permission to resolve or close cases."`,
        `AC-5.2: The Last Updated timestamp in the sidebar updates to the current time after every successful save.`,
      ];
      document.getElementById('ac-list').innerHTML = acs.map((ac, i) => `<div style="margin-bottom:4px;">${i+1}. ${ac}</div>`).join('');
    }

    function toggleACRef() {
      const body = document.getElementById('ac-ref-body');
      const toggle = document.getElementById('ac-ref-toggle');
      const isVisible = body.classList.contains('visible');
      body.classList.toggle('visible');
      toggle.textContent = isVisible ? '▼' : '▲';
    }

    function buildACReference() {
      const acs = [
        `AC-1.2: Outcome/Resolution visible ONLY to Senior Investigators. Absent from DOM for Juniors.`,
        `AC-2.1: Case Title is required. Save is blocked if blank.`,
        `AC-2.2: Case Title max 120 chars. 121st not accepted.`,
        `AC-3.4: When the Escalated checkbox is checked, the Escalation Reason dropdown must appear.`,
        `AC-4.2: Junior Investigators cannot set Status to Resolved or Closed. Save is blocked with: "You do not have permission to resolve or close cases."`,
        `AC-5.2: The Last Updated timestamp in the sidebar updates to the current time after every successful save.`,
      ];
      document.getElementById('ac-ref-body').innerHTML = acs.map((ac, i) => `<div style="margin-bottom:8px; font-size:var(--text-sm); color:var(--color-ink-soft);">${i+1}. ${ac}</div>`).join('');
    }

    // ── SECTION 6: QUIZ ENGINE ──────────────────────────────────────────────────

    /**
     * startQuiz()
     * Initializes the quiz by fetching the lesson-3 question bank and resetting state.
     * This was the missing function causing the quiz to not render.
     */
    function startQuiz() {
      quizQuestions = getQuestionsForLesson('lesson-3');
      currentQuestion = 0;
      quizAnswers = [];
      buildACReference();
      renderQuestion();
    }

    /**
     * renderQuestion()
     * Displays the current question and its multiple-choice options.
     */
    function renderQuestion() {
      const q = quizQuestions[currentQuestion];
      document.getElementById('quiz-progress').textContent = `Question ${currentQuestion + 1} of ${quizQuestions.length}`;
      document.getElementById('quiz-question-text').textContent = q.questionText;
      const container = document.getElementById('quiz-options');
      container.innerHTML = '';
      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'btn-answer';
        btn.textContent = opt;
        btn.onclick = () => handleAnswer(opt);
        container.appendChild(btn);
      });
      document.getElementById('quiz-feedback').className = 'feedback-panel';
    }

    /**
     * handleAnswer(selected)
     * Evaluates the selected answer, provides immediate feedback, and marks the option.
     * @param {string} selected - The text of the option clicked by the user.
     */
    function handleAnswer(selected) {
      const q = quizQuestions[currentQuestion];
      const isCorrect = (selected === q.correctAnswer);
      quizAnswers.push({ questionId: q.questionId, selectedAnswer: selected, correct: isCorrect });
      const btns = document.querySelectorAll('.btn-answer');
      btns.forEach(btn => {
        btn.disabled = true;
        if (btn.textContent === q.correctAnswer) btn.classList.add('correct');
        else if (btn.textContent === selected && !isCorrect) btn.classList.add('incorrect');
      });
      const panel = document.getElementById('quiz-feedback');
      panel.className = 'feedback-panel visible ' + (isCorrect ? 'feedback-correct' : 'feedback-incorrect');
      document.getElementById('feedback-title').innerHTML = isCorrect ? '✓ Correct!' : `✗ Incorrect. <br>The correct answer is: ${q.correctAnswer}`;
      document.getElementById('feedback-body').textContent = q.explanation;
      document.getElementById('btn-next-q').textContent = (currentQuestion === quizQuestions.length - 1) ? 'See results → ' : 'Next question → ';
    }

    /**
     * nextQuestion()
     * Advances to the next question in the bank or shows final results.
     */
    function nextQuestion() {
      currentQuestion++;
      if (currentQuestion < quizQuestions.length) {
        document.getElementById('quiz-feedback').className = 'feedback-panel';
        renderQuestion();
      } else {
        showResults();
      }
    }

    /**
     * showResults()
     * Calculates final score and renders a detailed breakdown of all answers.
     */
    function showResults() {
      document.getElementById('phase-quiz').style.display = 'none';
      document.getElementById('phase-results').style.display = 'block';
      const correctCount = quizAnswers.filter(a => a.correct).length;
      const scoreText = document.getElementById('score-text');
      scoreText.textContent = `You got ${correctCount} of ${quizQuestions.length} correct.`;
      scoreText.className = 'text-center font-bold my-4 ' + (correctCount >= 4 ? 'text-success' : correctCount >= 2 ? 'text-warning' : 'text-muted');
      const list = document.getElementById('results-list');
      list.innerHTML = '';
      quizAnswers.forEach((ans, i) => {
        const q = quizQuestions[i];
        const row = document.createElement('div');
        row.className = 'result-row';
        row.innerHTML = `<div class="result-icon">${ans.correct ? '✓' : '✗'}</div><div class="result-details">
          <div class="font-medium text-sm">${q.questionText}</div>
          ${!ans.correct ? `<div class="text-xs text-muted">Correct: ${q.correctAnswer}</div>` : ''}
          <span class="explanation-toggle" onclick="toggleExp(this)">Show explanation</span>
          <div class="explanation-text">${q.explanation}</div>
        </div>`;
        list.appendChild(row);
      });
    }

    function toggleExp(el) {
      const text = el.nextElementSibling;
      const isHidden = text.style.display === 'none' || text.style.display === '';
      text.style.display = isHidden ? 'block' : 'none';
      el.textContent = isHidden ? 'Hide explanation' : 'Show explanation';
    }

    async function completeLesson() {
      try {
        const progress = await getProgress(currentSession.caseId);
        const now = new Date().toISOString();
        var remainder = lessonSeconds % 30;
        if (remainder > 0) await addTimeSpent(currentSession.caseId, 'lesson-3', remainder);
        const results = {};
        quizAnswers.forEach(ans => { results[ans.questionId] = { selectedAnswer: ans.selectedAnswer, correct: ans.correct, answeredAt: now }; });
        const updatedProgress = progress || { caseId: currentSession.caseId, lessonsComplete: [], currentLesson: 'lesson-3', quizResults: {}, placementSurvey: { completed: true, recommendedPath: [], answers: [] }, certificateEarned: false };
        updatedProgress.quizResults['lesson-3'] = results;
        if (!updatedProgress.lessonsComplete.includes('lesson-3')) {
          updatedProgress.lessonsComplete.push('lesson-3');
        }
        updatedProgress.lastActivity = now;
        await saveProgress(updatedProgress);
        window.location.href = 'course.html';
      } catch (e) { console.error(e); showToast('Error saving progress', 'error'); }
    }

    function handleLogout() {
      var remainder = lessonSeconds % 30;
      if (remainder > 0 && currentSession) addTimeSpent(currentSession.caseId, 'lesson-3', remainder);
      endSession();
      window.location.href = 'index.html';
    }
  </script>
